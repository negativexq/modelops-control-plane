name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # Brings up the real docker-compose stack (9 containers: 8 HTTP-exposed services
  # + the worker, which has no HTTP surface) and exercises it over HTTP exactly like
  # a human demoing the platform would - including waiting for the real automated
  # worker to actually act (not a manual call standing in for it): a real automatic
  # rollback triggered by an injected latency fault, and a real automatic promotion
  # walked through every traffic stage. Deliberately separate from and gated on the
  # lint/unit-test jobs above (no point building 9 containers if `ruff` alone
  # already failed) - see backend/scripts/ci_smoke_test.py's docstring for the full
  # scenario list and for why this job exists at all: every real bug found in this
  # project was found by running the actual stack, not by a unit test with mocked
  # collaborators.
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    env:
      # The worker's real (production) poll interval is 15s - two of the three
      # smoke-test scenarios wait for it to actually act (real automatic rollback,
      # real automatic promote through every traffic stage), which would make this
      # job needlessly slow at that cadence. Turned down for this job only; local
      # `make dev` is unaffected since this env var isn't set there.
      WORKER_POLL_INTERVAL_SECONDS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare model artifacts (generate data, train v1/v2-good/v2-quality-bad)
        run: make prepare-models
      - name: Bring up the full stack
        run: docker compose up -d --build
      - name: Run the integration smoke test
        run: .venv/bin/python -m scripts.ci_smoke_test
        working-directory: backend
      # `docker compose logs` (below) only ever shows uvicorn access lines
      # ("POST /evaluate 200 OK") - never a response body, so it can't say
      # *which* policy check actually failed. ci_smoke_test.py records every
      # deployment it creates to /tmp/ci_smoke_deployment_ids.log as it goes
      # (see _record_deployment_id) specifically so this step can look that up
      # while the backend is still up (before "Tear down" below) - see
      # docs/DESIGN_NOTES.md#manual-automation-hold for the blind spot this
      # closes.
      - name: Dump policy diagnostics on failure
        if: failure()
        run: |
          log_file=/tmp/ci_smoke_deployment_ids.log
          if [ ! -f "$log_file" ]; then
            echo "no deployment ids were recorded - failure happened before any scenario created one"
            exit 0
          fi
          while IFS='=' read -r label id; do
            echo "=== $label ($id) - GET /api/deployments/$id/timeline ==="
            curl -s "http://localhost:8000/api/deployments/$id/timeline" | python3 -m json.tool || true
            echo
          done < "$log_file"
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
