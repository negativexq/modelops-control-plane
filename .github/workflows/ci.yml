name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  # The dashboard's API types are generated from the control plane's OpenAPI
  # schema (frontend/openapi.json -> frontend/src/lib/api-schema.ts). Regenerate
  # both from the code being tested and fail if either differs from what's
  # committed: an API change has to bring the dashboard's types along with it.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e . -c constraints-api-contract.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Regenerate the schema and the TypeScript types
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run gen:api
      - name: Fail if they differ from what's committed
        run: |
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/lib/api-schema.ts; then
            echo "::error::The API changed but frontend/openapi.json / src/lib/api-schema.ts weren't regenerated. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi

  # Brings up the real docker-compose stack (10 ModelOps containers: 9 HTTP-exposed
  # services, including the webhook sink, + the worker; plus Prometheus, Grafana and Jaeger) and exercises it over HTTP exactly like
  # a human demoing the platform would - including waiting for the real automated
  # worker to actually act (not a manual call standing in for it): a real automatic
  # rollback triggered by an injected latency fault, and a real automatic promotion
  # walked through every traffic stage. Deliberately separate from and gated on the
  # lint/unit-test jobs above (no point building 9 containers if `ruff` alone
  # already failed) - see backend/scripts/ci_smoke_test.py's docstring for the full
  # scenario list and for why this job exists at all: every real bug found in this
  # project was found by running the actual stack, not by a unit test with mocked
  # collaborators.
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, api-contract]
    timeout-minutes: 20
    env:
      # The worker's real (production) poll interval is 15s - two of the three
      # smoke-test scenarios wait for it to actually act (real automatic rollback,
      # real automatic promote through every traffic stage), which would make this
      # job needlessly slow at that cadence. Turned down for this job only; local
      # `make dev` is unaffected since this env var isn't set there.
      WORKER_POLL_INTERVAL_SECONDS: "2"
      # A quality evaluation can be due every 30s. Give the smoke test enough
      # headroom for the final post-ramp evaluation without weakening its
      # labeled-data gates.
      CI_QUALITY_SCENARIO_TIMEOUT_SECONDS: "360"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare model artifacts (generate data, train v1/v2-good/v2-quality-bad)
        run: make prepare-models
      - name: Bring up the full stack
        run: docker compose up -d --build
      - name: Run the integration smoke test
        run: .venv/bin/python -m scripts.ci_smoke_test
        working-directory: backend
      # Prometheus scrapes every service, the alert rules and Grafana dashboards
      # load, the smoke test's real promote/rollback show up in the decision
      # counters, and its predictions' traces reach a model service in Jaeger.
      - name: Check metrics, dashboards and traces
        run: .venv/bin/python -m scripts.check_observability
        working-directory: backend
      # Browser tests against the same live stack, after the smoke test so there's
      # real rollout history to render. They use their own model name (e2e-ui) and
      # paused rollouts, so the worker can't race them.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        # The running frontend container mounts ./frontend with an anonymous
        # volume over /app/node_modules; Docker creates that mount point on the
        # host as an empty, root-owned frontend/node_modules, which npm ci (as
        # the runner user) can't write into.
        run: |
          sudo chown -R "$(id -u):$(id -g)" node_modules 2>/dev/null || true
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      # `docker compose logs` (below) only ever shows uvicorn access lines
      # ("POST /evaluate 200 OK") - never a response body, so it can't say
      # *which* policy check actually failed. ci_smoke_test.py records every
      # deployment it creates to /tmp/ci_smoke_deployment_ids.log as it goes
      # (see _record_deployment_id) specifically so this step can look that up
      # while the backend is still up (before "Tear down" below) - see
      # docs/DESIGN_NOTES.md#manual-automation-hold for the blind spot this
      # closes.
      - name: Dump policy diagnostics on failure
        if: failure()
        run: |
          log_file=/tmp/ci_smoke_deployment_ids.log
          if [ ! -f "$log_file" ]; then
            echo "no deployment ids were recorded - failure happened before any scenario created one"
            exit 0
          fi
          while IFS='=' read -r label id; do
            echo "=== $label ($id) - GET /api/deployments/$id/timeline ==="
            curl -s "http://localhost:8000/api/deployments/$id/timeline" | python3 -m json.tool || true
            echo
          done < "$log_file"
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
