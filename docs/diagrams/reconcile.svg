<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" width="1240" height="330" role="img" aria-label="Reconciliation timeline: desired revision r7, router restarts to r0, worker re-pushes r7">
<title>Reconciliation timeline: desired revision r7, router restarts to r0, worker re-pushes r7</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #12161d; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #12161d; }
  .mut { fill: #646972; }
  .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
  .fast { animation-duration: 0.8s; }
  .slow { animation-duration: 3s; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity=".08"/></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646972"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="329" rx="16" fill="#f9fafb" stroke="#dfe1e5"/>
<text x="40" y="52" class="t" font-size="17" font-weight="650" text-anchor="start">Desired state vs observed state</text>
<text x="40" y="76" class="t mut" font-size="13" font-weight="400" text-anchor="start">The database's split is the truth. The router's copy can vanish at any time; the worker puts it back.</text>
<text x="40" y="138" class="t" font-size="14" font-weight="650" text-anchor="start">Desired</text>
<text x="40" y="156" class="t mut" font-size="12" font-weight="400" text-anchor="start">database</text>
<line x1="230" y1="144" x2="1190" y2="144" stroke="#dfe1e5" stroke-width="1.5"/>
<text x="40" y="228" class="t" font-size="14" font-weight="650" text-anchor="start">Observed</text>
<text x="40" y="246" class="t mut" font-size="12" font-weight="400" text-anchor="start">router</text>
<line x1="230" y1="234" x2="1190" y2="234" stroke="#dfe1e5" stroke-width="1.5"/>
<rect x="230" y="127" width="284" height="34" rx="8" fill="#6b727e" opacity=".12"/>
<rect x="230" y="127" width="4" height="34" rx="2" fill="#6b727e"/>
<text x="244" y="149" class="m" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#6b727e">r6 · canary 10%</text>
<rect x="520" y="127" width="664" height="34" rx="8" fill="#0086d8" opacity=".12"/>
<rect x="520" y="127" width="4" height="34" rx="2" fill="#0086d8"/>
<text x="534" y="149" class="m" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#0086d8">r7 · canary 25%</text>
<rect x="230" y="217" width="304" height="34" rx="8" fill="#6b727e" opacity=".12"/>
<rect x="230" y="217" width="4" height="34" rx="2" fill="#6b727e"/>
<text x="244" y="239" class="m" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#6b727e">r6</text>
<rect x="540" y="217" width="214" height="34" rx="8" fill="#0086d8" opacity=".12"/>
<rect x="540" y="217" width="4" height="34" rx="2" fill="#0086d8"/>
<text x="554" y="239" class="m" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#0086d8">r7</text>
<rect x="760" y="217" width="194" height="34" rx="8" fill="#e23439" opacity=".12"/>
<rect x="760" y="217" width="4" height="34" rx="2" fill="#e23439"/>
<text x="774" y="239" class="m" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#e23439">r0 bootstrap</text>
<rect x="960" y="217" width="224" height="34" rx="8" fill="#009956" opacity=".12"/>
<rect x="960" y="217" width="4" height="34" rx="2" fill="#009956"/>
<text x="974" y="239" class="m" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#009956">r7 · router_reconciled</text>
<line x1="520" y1="104" x2="520" y2="270" stroke="#0086d8" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="520" y="290" class="t" font-size="12" font-weight="400" text-anchor="middle" style="fill:#0086d8">worker: PASS → 25%</text>
<line x1="760" y1="104" x2="760" y2="270" stroke="#e23439" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="760" y="290" class="t" font-size="12" font-weight="400" text-anchor="middle" style="fill:#e23439">router restarts</text>
<line x1="960" y1="104" x2="960" y2="270" stroke="#009956" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="960" y="290" class="t" font-size="12" font-weight="400" text-anchor="middle" style="fill:#009956">next worker tick</text>
<path d="M528,154 L548,216" fill="none" stroke="#dfe1e5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M528,154 L548,216" fill="none" stroke="#0086d8" stroke-width="1.5" stroke-linecap="round" class="flow fast"/>
<path d="M968,154 L968,216" fill="none" stroke="#dfe1e5" stroke-width="4" stroke-linecap="round"/>
<path d="M968,154 L968,216" fill="none" stroke="#009956" stroke-width="2" stroke-linecap="round" class="flow "/>
<text x="1190" y="316" class="t mut" font-size="11.5" font-weight="400" text-anchor="end">A push older than what the router holds is rejected (409), so a late push can't bring back an old split.</text>
</svg>
