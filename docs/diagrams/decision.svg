<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-label="Decision rule: PASS inside the limit, INCONCLUSIVE when the interval straddles it, FAIL when the whole interval is past it">
<title>Decision rule: PASS inside the limit, INCONCLUSIVE when the interval straddles it, FAIL when the whole interval is past it</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #12161d; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #12161d; }
  .mut { fill: #646972; }
  .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
  .fast { animation-duration: 0.8s; }
  .slow { animation-duration: 3s; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity=".08"/></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646972"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="399" rx="16" fill="#f9fafb" stroke="#dfe1e5"/>
<text x="40" y="52" class="t" font-size="17" font-weight="650" text-anchor="start">How one check decides</text>
<text x="40" y="76" class="t mut" font-size="13" font-weight="400" text-anchor="start">Canary error rate with its 95% confidence interval, against a 5% limit.</text>
<rect x="533.3333333333334" y="100" width="326.66666666666663" height="240" fill="#e23439" opacity=".05"/>
<line x1="533.3333333333334" y1="96" x2="533.3333333333334" y2="344" stroke="#e23439" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="541.3333333333334" y="112" class="m" font-size="12" font-weight="600" text-anchor="start" style="fill:#e23439">limit 5%</text>
<line x1="300.0" y1="344" x2="300.0" y2="350" stroke="#646972"/>
<text x="300.0" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">0%</text>
<line x1="393.3333333333333" y1="344" x2="393.3333333333333" y2="350" stroke="#646972"/>
<text x="393.3333333333333" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">2%</text>
<line x1="486.66666666666663" y1="344" x2="486.66666666666663" y2="350" stroke="#646972"/>
<text x="486.66666666666663" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">4%</text>
<line x1="580.0" y1="344" x2="580.0" y2="350" stroke="#646972"/>
<text x="580.0" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">6%</text>
<line x1="673.3333333333333" y1="344" x2="673.3333333333333" y2="350" stroke="#646972"/>
<text x="673.3333333333333" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">8%</text>
<line x1="766.6666666666667" y1="344" x2="766.6666666666667" y2="350" stroke="#646972"/>
<text x="766.6666666666667" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">10%</text>
<line x1="860.0" y1="344" x2="860.0" y2="350" stroke="#646972"/>
<text x="860.0" y="368" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">12%</text>
<line x1="300" y1="344" x2="860" y2="344" stroke="#dfe1e5" stroke-width="1.5"/>
<rect x="40" y="146" width="52.4" height="26" rx="13" fill="#009956" opacity=".12"/>
<text x="66.2" y="164" class="m" font-size="12" font-weight="700" text-anchor="middle" style="fill:#009956">PASS</text>
<line x1="332.6666666666667" y1="160" x2="412.0" y2="160" stroke="#009956" stroke-width="6" stroke-linecap="round" opacity=".35"/>
<line x1="332.6666666666667" y1="151" x2="332.6666666666667" y2="169" stroke="#009956" stroke-width="2"/>
<line x1="412.0" y1="151" x2="412.0" y2="169" stroke="#009956" stroke-width="2"/>
<circle cx="360.6666666666667" cy="160" r="6.5" fill="#009956"/>
<circle cx="360.6666666666667" cy="160" r="6.5" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="360.6666666666667" y="144" class="m" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:#009956">1.3%</text>
<text x="900" y="157" class="t" font-size="13" font-weight="400" text-anchor="start">estimate within the limit</text>
<text x="900" y="175" class="t mut" font-size="13" font-weight="400" text-anchor="start">keep going: next traffic step</text>
<rect x="40" y="216" width="113.19999999999999" height="26" rx="13" fill="#de9300" opacity=".12"/>
<text x="96.6" y="234" class="m" font-size="12" font-weight="700" text-anchor="middle" style="fill:#de9300">INCONCLUSIVE</text>
<line x1="458.66666666666663" y1="230" x2="771.3333333333333" y2="230" stroke="#de9300" stroke-width="6" stroke-linecap="round" opacity=".35"/>
<line x1="458.66666666666663" y1="221" x2="458.66666666666663" y2="239" stroke="#de9300" stroke-width="2"/>
<line x1="771.3333333333333" y1="221" x2="771.3333333333333" y2="239" stroke="#de9300" stroke-width="2"/>
<circle cx="589.3333333333333" cy="230" r="6.5" fill="#de9300" class="pulse"/>
<circle cx="589.3333333333333" cy="230" r="6.5" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="589.3333333333333" y="214" class="m" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:#de9300">6.2%</text>
<text x="900" y="227" class="t" font-size="13" font-weight="400" text-anchor="start">past the limit, but the interval</text>
<text x="900" y="245" class="t mut" font-size="13" font-weight="400" text-anchor="start">still reaches below it: could be noise</text>
<rect x="40" y="286" width="52.4" height="26" rx="13" fill="#e23439" opacity=".12"/>
<text x="66.2" y="304" class="m" font-size="12" font-weight="700" text-anchor="middle" style="fill:#e23439">FAIL</text>
<line x1="640.6666666666667" y1="300" x2="822.6666666666666" y2="300" stroke="#e23439" stroke-width="6" stroke-linecap="round" opacity=".35"/>
<line x1="640.6666666666667" y1="291" x2="640.6666666666667" y2="309" stroke="#e23439" stroke-width="2"/>
<line x1="822.6666666666666" y1="291" x2="822.6666666666666" y2="309" stroke="#e23439" stroke-width="2"/>
<circle cx="724.6666666666667" cy="300" r="6.5" fill="#e23439"/>
<circle cx="724.6666666666667" cy="300" r="6.5" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="724.6666666666667" y="284" class="m" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:#e23439">9.1%</text>
<text x="900" y="297" class="t" font-size="13" font-weight="400" text-anchor="start">the whole interval is</text>
<text x="900" y="315" class="t mut" font-size="13" font-weight="400" text-anchor="start">past the limit: roll back</text>
</svg>
