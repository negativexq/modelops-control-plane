<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-label="The control loop: gateway metrics, control plane windows, policy engine, worker, config push back to the gateway">
<title>The control loop: gateway metrics, control plane windows, policy engine, worker, config push back to the gateway</title>
<style>
  .t { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #12161d; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #12161d; }
  .mut { fill: #646972; }
  .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
  .fast { animation-duration: 0.8s; }
  .slow { animation-duration: 3s; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity=".08"/></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646972"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1239" height="469" rx="16" fill="#f9fafb" stroke="#dfe1e5"/>
<rect x="40" y="60" width="200" height="230" rx="12" fill="#ffffff" stroke="#dfe1e5" filter="url(#sh)"/>
<circle cx="58" cy="86" r="4.5" fill="#009956" class="pulse"/>
<text x="72" y="91" class="t" font-size="15" font-weight="650" text-anchor="start">Gateway</text>
<text x="56" y="120" class="t mut" font-size="12" font-weight="400" text-anchor="start">every request becomes</text>
<text x="56" y="137" class="t mut" font-size="12" font-weight="400" text-anchor="start">one metric row</text>
<text x="56" y="180" class="m" font-size="30" font-weight="650" text-anchor="start">100.3</text>
<text x="56" y="202" class="t mut" font-size="12" font-weight="400" text-anchor="start">req/s · last 10 s</text>
<text x="56" y="240" class="m mut" font-size="12" font-weight="400" text-anchor="start">latency · status ·</text>
<text x="56" y="257" class="m mut" font-size="12" font-weight="400" text-anchor="start">prediction_id</text>
<rect x="300" y="60" width="230" height="230" rx="12" fill="#ffffff" stroke="#dfe1e5" filter="url(#sh)"/>
<circle cx="318" cy="86" r="4.5" fill="#0086d8"/>
<text x="332" y="91" class="t" font-size="15" font-weight="650" text-anchor="start">Control plane</text>
<text x="316" y="120" class="t mut" font-size="12" font-weight="400" text-anchor="start">windows the samples</text>
<rect x="316" y="140" width="198" height="52" rx="8" fill="#f9fafb" stroke="#dfe1e5"/>
<text x="330" y="161" class="t" font-size="13" font-weight="600" text-anchor="start">reliability</text>
<text x="330" y="179" class="t mut" font-size="11.5" font-weight="400" text-anchor="start">last 60 s</text>
<rect x="420" y="155" width="5" height="22" rx="1.5" fill="#0086d8" opacity="0.25"/>
<rect x="429" y="155" width="5" height="22" rx="1.5" fill="#0086d8" opacity="0.32"/>
