<rect x="501" y="155" width="5" height="22" rx="1.5" fill="#0086d8" opacity="0.88"/>
<rect x="316" y="206" width="198" height="52" rx="8" fill="#f9fafb" stroke="#dfe1e5"/>
<text x="330" y="227" class="t" font-size="13" font-weight="600" text-anchor="start">quality</text>
<text x="330" y="245" class="t mut" font-size="11.5" font-weight="400" text-anchor="start">matured labels</text>
<rect x="420" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.25"/>
<rect x="429" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.32"/>
<rect x="438" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.39"/>
<rect x="447" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.46"/>
