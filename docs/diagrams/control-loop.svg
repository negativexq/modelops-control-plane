<rect x="465" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.60"/>
<rect x="474" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.67"/>
<rect x="483" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.74"/>
<rect x="492" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.81"/>
<rect x="501" y="221" width="5" height="22" rx="1.5" fill="#de9300" opacity="0.88"/>
<rect x="590" y="60" width="350" height="230" rx="12" fill="#ffffff" stroke="#dfe1e5" filter="url(#sh)"/>
<circle cx="608" cy="86" r="4.5" fill="#009956"/>
<text x="622" y="91" class="t" font-size="15" font-weight="650" text-anchor="start">Policy engine</text>
<text x="924" y="91" class="m mut" font-size="12" font-weight="400" text-anchor="end">95% CI</text>
<circle cx="612" cy="122" r="4" fill="#009956"/>
<text x="624" y="126" class="t" font-size="13" font-weight="400" text-anchor="start">error rate</text>
<text x="780" y="126" class="m" font-size="13" font-weight="600" text-anchor="end">0.4%</text>
<text x="924" y="126" class="m mut" font-size="12" font-weight="400" text-anchor="end">[0.2, 0.9]</text>
<circle cx="612" cy="160" r="4" fill="#e23439"/>
<text x="624" y="164" class="t" font-size="13" font-weight="400" text-anchor="start">p95 Δ</text>
<text x="780" y="164" class="m" font-size="13" font-weight="600" text-anchor="end">+3126%</text>
<text x="924" y="164" class="m mut" font-size="12" font-weight="400" text-anchor="end">[2984, 3289]</text>
<circle cx="612" cy="198" r="4" fill="#009956"/>
<text x="624" y="202" class="t" font-size="13" font-weight="400" text-anchor="start">recall</text>
<text x="780" y="202" class="m" font-size="13" font-weight="600" text-anchor="end">0.943</text>
<text x="924" y="202" class="m mut" font-size="12" font-weight="400" text-anchor="end">[0.898, 0.969]</text>
<circle cx="612" cy="236" r="4" fill="#de9300"/>
<text x="624" y="240" class="t" font-size="13" font-weight="400" text-anchor="start">label coverage</text>
<text x="780" y="240" class="m" font-size="13" font-weight="600" text-anchor="end">—</text>
<text x="924" y="240" class="m mut" font-size="12" font-weight="400" text-anchor="end">waiting</text>
<line x1="606" y1="260" x2="924" y2="260" stroke="#dfe1e5"/>
<text x="606" y="280" class="m" font-size="12" font-weight="600" text-anchor="start">FAIL &gt; INCONCLUSIVE &gt; PASS</text>
<rect x="1010" y="60" width="190" height="230" rx="12" fill="#ffffff" stroke="#dfe1e5" filter="url(#sh)"/>
<circle cx="1028" cy="86" r="4.5" fill="#6b727e"/>
<text x="1042" y="91" class="t" font-size="15" font-weight="650" text-anchor="start">Worker</text>
<text x="1026" y="120" class="t mut" font-size="12" font-weight="400" text-anchor="start">acts on the verdict</text>
<text x="1026" y="152" class="m" font-size="12" font-weight="650" text-anchor="start" style="fill:#009956">PASS</text>
<text x="1026" y="170" class="t mut" font-size="12" font-weight="400" text-anchor="start">next step / promote</text>
<text x="1026" y="196" class="m" font-size="12" font-weight="650" text-anchor="start" style="fill:#e23439">FAIL</text>
<text x="1026" y="214" class="t mut" font-size="12" font-weight="400" text-anchor="start">roll back</text>
<text x="1026" y="240" class="m" font-size="12" font-weight="650" text-anchor="start" style="fill:#de9300">INCONCLUSIVE</text>
<text x="1026" y="258" class="t mut" font-size="12" font-weight="400" text-anchor="start">retry, then freeze</text>
