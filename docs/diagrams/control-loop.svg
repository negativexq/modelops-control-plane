<path d="M530,175.0 L590,175.0" fill="none" stroke="#0086d8" stroke-width="2.5" stroke-linecap="round" class="flow "/>
<text x="560.0" y="163.0" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">evaluate</text>
<path d="M940,175.0 L1010,175.0" fill="none" stroke="#dfe1e5" stroke-width="4.5" stroke-linecap="round"/>
<path d="M940,175.0 L1010,175.0" fill="none" stroke="#0086d8" stroke-width="2.5" stroke-linecap="round" class="flow "/>
<text x="975.0" y="163.0" class="m mut" font-size="11.5" font-weight="400" text-anchor="middle">verdict</text>
<path d="M1105,290 L1105,362 Q1105,380 1087,380 L158,380 Q140,380 140,362 L140,290" fill="none" stroke="#dfe1e5" stroke-width="4.5" stroke-linecap="round"/>
<path d="M1105,290 L1105,362 Q1105,380 1087,380 L158,380 Q140,380 140,362 L140,290" fill="none" stroke="#009956" stroke-width="2.5" stroke-linecap="round" class="flow slow"/>
<rect x="483.4" y="368" width="278.2" height="20" rx="10" fill="#ffffff" stroke="#dfe1e5"/>
<text x="622.5" y="382" class="m" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#009956">config push · routing revision r7 → r8</text>
<path d="M415,430 L415,290" fill="none" stroke="#dfe1e5" stroke-width="4" stroke-linecap="round"/>
<path d="M415,430 L415,290" fill="none" stroke="#de9300" stroke-width="2" stroke-linecap="round" class="flow slow"/>
<rect x="293.15" y="418" width="243.70000000000002" height="20" rx="10" fill="#ffffff" stroke="#dfe1e5"/>
<text x="415.0" y="432" class="m" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#de9300">delayed labels · POST /api/labels</text>
<text x="1200" y="434" class="t mut" font-size="12" font-weight="400" text-anchor="end">polls every 15 s · evaluates each rollout once per window · same API an operator uses</text>
</svg>
