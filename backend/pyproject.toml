[project]
name = "modelops-backend"
version = "0.1.0"
description = "ModelOps Control Plane - backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "httpx>=0.27",
    # The backend service spawns scripts.benchmarks.run_benchmark as a subprocess
    # (see app/benchmarks/service.py) for dashboard-triggered benchmark runs, which
    # in turn shells out to `python -m locust` - so this needs to be a core runtime
    # dependency of the backend image, not just a dev/CLI tool.
    "locust>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
