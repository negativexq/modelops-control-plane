# Scrapes every ModelOps service's /metrics (app/observability/metrics.py).
# Short interval on purpose: a canary step is minutes long, and the dashboards
# should show a latency or error spike while the rollout is still deciding.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]

  - job_name: router
    static_configs:
      - targets: ["router:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # One container per routable version. `route_version` is the name the router
  # sends traffic to - the two fault containers serve the v2-good artifact, so
  # their own `version` label says v2-good while the router calls them
  # v2-good-latency-fault / v2-good-error-fault.
  - job_name: serving
    static_configs:
      - targets: ["model-serving-v1:8000"]
        labels: { route_version: v1 }
      - targets: ["model-serving-v2-good:8000"]
        labels: { route_version: v2-good }
      - targets: ["model-serving-v2-quality-bad:8000"]
        labels: { route_version: v2-quality-bad }
      - targets: ["model-serving-v2-good-latency-fault:8000"]
        labels: { route_version: v2-good-latency-fault }
      - targets: ["model-serving-v2-good-error-fault:8000"]
        labels: { route_version: v2-good-error-fault }
